# Cargo Deny Configuration

[graph]
targets = []

[licenses]
# The confidence threshold for license classification
confidence-threshold = 0.8
# Allow list of licenses
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "CC0-1.0",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Zlib",
]
# Deny list of licenses
deny = [
    "GPL-1.0",
    "GPL-2.0",
    "GPL-3.0",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
    "AGPL-1.0",
    "AGPL-3.0",
]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
