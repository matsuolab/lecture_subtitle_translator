name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: subtitle-editor-windows-x64.zip
            build_args: --no-bundle
            ffmpeg_target: x86_64-pc-windows-msvc

          - os: macos-latest
            asset: subtitle-editor-macos-arm64.app.zip
            build_args: --bundles app
            ffmpeg_target: aarch64-apple-darwin

          - os: ubuntu-22.04
            asset: subtitle-editor-linux-x64.AppImage
            build_args: --bundles appimage
            ffmpeg_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download ffmpeg sidecar (LGPL)
        shell: bash
        env:
          FFMPEG_TARGET: ${{ matrix.ffmpeg_target }}
        run: |
          set -euo pipefail
          mkdir -p frontend/src-tauri/binaries
          case "$FFMPEG_TARGET" in
            x86_64-pc-windows-msvc)
              url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
              curl -L -o /tmp/ffmpeg.zip "$url"
              unzip -j /tmp/ffmpeg.zip "ffmpeg-master-latest-win64-lgpl/bin/ffmpeg.exe" -d /tmp/
              mv /tmp/ffmpeg.exe "frontend/src-tauri/binaries/ffmpeg-${FFMPEG_TARGET}.exe"
              ;;
            x86_64-unknown-linux-gnu)
              url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz"
              curl -L -o /tmp/ffmpeg.tar.xz "$url"
              mkdir -p /tmp/ffmpeg-extract
              tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=1
              cp /tmp/ffmpeg-extract/bin/ffmpeg "frontend/src-tauri/binaries/ffmpeg-${FFMPEG_TARGET}"
              chmod +x "frontend/src-tauri/binaries/ffmpeg-${FFMPEG_TARGET}"
              ;;
            aarch64-apple-darwin)
              url="https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
              curl -L -o /tmp/ffmpeg.zip "$url"
              unzip /tmp/ffmpeg.zip -d /tmp/ffmpeg-extract
              cp /tmp/ffmpeg-extract/ffmpeg "frontend/src-tauri/binaries/ffmpeg-${FFMPEG_TARGET}"
              chmod +x "frontend/src-tauri/binaries/ffmpeg-${FFMPEG_TARGET}"
              ;;
            *)
              echo "unknown ffmpeg target: $FFMPEG_TARGET" >&2
              exit 1
              ;;
          esac
          ls -lh "frontend/src-tauri/binaries/"

      - name: Generate icons
        working-directory: frontend
        run: npx @tauri-apps/cli icon src-tauri/app-icon.png

      - name: Build Tauri app (portable)
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_GITHUB_TOKEN: ${{ secrets.RELEASE_CHECK_TOKEN }}
        run: npx @tauri-apps/cli build ${{ matrix.build_args }}

      - name: Prepare Windows artifact
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          # subtitle-editor.exe と ffmpeg.exe (Tauri が target/release/ に配置) を
          # 1つの zip にまとめて配布する。ユーザーは解凍してフォルダごと配置すれば動く。
          mkdir -p subtitle-editor-windows-x64
          cp frontend/src-tauri/target/release/subtitle-editor.exe subtitle-editor-windows-x64/
          cp frontend/src-tauri/target/release/ffmpeg.exe subtitle-editor-windows-x64/
          7z a -tzip "${{ matrix.asset }}" subtitle-editor-windows-x64/

      - name: Prepare macOS artifact
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          app_path="$(find frontend/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "macOS app bundle not found"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "${{ matrix.asset }}"

      - name: Prepare Linux artifact
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          appimage_path="$(find frontend/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          if [[ -z "$appimage_path" ]]; then
            echo "AppImage not found"
            exit 1
          fi
          cp "$appimage_path" "${{ matrix.asset }}"

      - name: Upload to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.asset }}

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  build-fedora-rpm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download ffmpeg sidecar (LGPL, linux x64)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/src-tauri/binaries
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz"
          curl -L -o /tmp/ffmpeg.tar.xz "$url"
          mkdir -p /tmp/ffmpeg-extract
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=1
          cp /tmp/ffmpeg-extract/bin/ffmpeg frontend/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod +x frontend/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          ls -lh frontend/src-tauri/binaries/

      - name: Build Fedora RPM in container
        shell: bash
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_GITHUB_TOKEN: ${{ secrets.RELEASE_CHECK_TOKEN }}
        run: |
          docker run --rm \
            -e VITE_APP_VERSION \
            -e VITE_GITHUB_TOKEN \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                nodejs \
                npm \
                rust \
                cargo \
                gcc \
                gcc-c++ \
                make \
                webkit2gtk4.1-devel \
                openssl-devel \
                curl \
                wget \
                file \
                libappindicator-gtk3-devel \
                librsvg2-devel \
                libxdo-devel \
                rpm-build \
                patchelf

              cd frontend
              npm ci
              npx @tauri-apps/cli icon src-tauri/app-icon.png
              npx @tauri-apps/cli build --bundles rpm
              chown -R '"$(id -u):$(id -g)"' /work/frontend
            '

      - name: Prepare Fedora RPM artifact
        shell: bash
        run: |
          rpm_path="$(find frontend/src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)"
          if [[ -z "$rpm_path" ]]; then
            echo "RPM not found"
            exit 1
          fi
          cp "$rpm_path" subtitle-editor-linux-fedora-x64.rpm

      - name: Upload Fedora RPM to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: subtitle-editor-linux-fedora-x64.rpm

      - name: Upload Fedora RPM workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-editor-linux-fedora-x64.rpm
          path: subtitle-editor-linux-fedora-x64.rpm
