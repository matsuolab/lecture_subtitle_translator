name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: subtitle-editor-windows-x64.exe
            build_args: --no-bundle

          - os: macos-latest
            asset: subtitle-editor-macos-arm64.app.zip
            build_args: --bundles app

          - os: ubuntu-22.04
            asset: subtitle-editor-linux-x64.AppImage
            build_args: --bundles appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate icons
        working-directory: frontend
        run: npx @tauri-apps/cli icon src-tauri/app-icon.png

      - name: Build Tauri app (portable)
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_GITHUB_TOKEN: ${{ secrets.RELEASE_CHECK_TOKEN }}
        run: npx @tauri-apps/cli build ${{ matrix.build_args }}

      - name: Prepare Windows artifact
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cp "frontend/src-tauri/target/release/subtitle-editor.exe" "${{ matrix.asset }}"

      - name: Prepare macOS artifact
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          app_path="$(find frontend/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "macOS app bundle not found"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "${{ matrix.asset }}"

      - name: Prepare Linux artifact
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          appimage_path="$(find frontend/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          if [[ -z "$appimage_path" ]]; then
            echo "AppImage not found"
            exit 1
          fi
          cp "$appimage_path" "${{ matrix.asset }}"

      - name: Upload to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.asset }}

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  build-fedora-rpm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Fedora RPM in container
        shell: bash
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_GITHUB_TOKEN: ${{ secrets.RELEASE_CHECK_TOKEN }}
        run: |
          docker run --rm \
            -e VITE_APP_VERSION \
            -e VITE_GITHUB_TOKEN \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                nodejs \
                npm \
                rust \
                cargo \
                gcc \
                gcc-c++ \
                make \
                webkit2gtk4.1-devel \
                openssl-devel \
                curl \
                wget \
                file \
                libappindicator-gtk3-devel \
                librsvg2-devel \
                libxdo-devel \
                rpm-build \
                patchelf

              cd frontend
              npm ci
              npx @tauri-apps/cli icon src-tauri/app-icon.png
              npx @tauri-apps/cli build --bundles rpm
              chown -R '"$(id -u):$(id -g)"' /work/frontend
            '

      - name: Prepare Fedora RPM artifact
        shell: bash
        run: |
          rpm_path="$(find frontend/src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)"
          if [[ -z "$rpm_path" ]]; then
            echo "RPM not found"
            exit 1
          fi
          cp "$rpm_path" subtitle-editor-linux-fedora-x64.rpm

      - name: Upload Fedora RPM to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: subtitle-editor-linux-fedora-x64.rpm

      - name: Upload Fedora RPM workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-editor-linux-fedora-x64.rpm
          path: subtitle-editor-linux-fedora-x64.rpm
